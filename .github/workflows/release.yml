name: Create a release file

# Releases artifact from the build workflow

on: workflow_dispatch

permissions: {}

jobs:
  build:
    name: Create artifacts from master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - public_url: gallery # wf
            data_folder: data
          - public_url: galleryNAC # nac
            data_folder: dataNAC
          - public_url: galleryNERC # nerc
            data_folder: dataNERC
          - public_url: galleryLAC # lac
            data_folder: dataLAC
          - public_url: galleryAE # ae
            data_folder: dataAE
          - public_url: galleryAW # aw
            data_folder: dataAW
          - public_url: galleryAP # ap
            data_folder: dataAP
          - public_url: galleryEU # eu
            data_folder: dataEU
          - public_url: galleryACPC # acpc
            data_folder: dataACPC

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        env:
          PUBLIC_URL: ${{ matrix.public_url }}
          VITE_DATA_FOLDER: ${{ matrix.data_folder }}
        run: ./build.sh
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.public_url }}
          path: ${{ matrix.public_url }}.zip
          retention-days: 1
          if-no-files-found: error
  merge:
    name: Merge zips into one
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions: {}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: .
      - name: Unzip all zip from multiple zips
        run: |
          mkdir build-all
          cp build-*/*.zip build-all
          cd build-all
          ls
          unzip '*.zip'
          rm *.zip
          ls
      - name: Upload raw
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all
          path: build-all

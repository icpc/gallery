name: Publish GitHub Pages

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Create artifacts from master
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - public_url: gallery # wf
            data_folder: data
            folder: gallery
          - public_url: gallery/nac # nac
            data_folder: dataNAC
            folder: nac
          - public_url: gallery/nerc # nerc
            data_folder: dataNERC
            folder: nerc
          - public_url: gallery/lac # lac
            data_folder: dataLAC
            folder: lac
          - public_url: gallery/ae # ae
            data_folder: dataAE
            folder: ae
          - public_url: gallery/aw # aw
            data_folder: dataAW
            folder: aw
          - public_url: gallery/ap # ap
            data_folder: dataAP
            folder: ap
          - public_url: gallery/eu # eu
            data_folder: dataEU
            folder: eu
          - public_url: gallery/acpc # acpc
            data_folder: dataACPC
            folder: acpc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        env:
          PUBLIC_URL: ${{ matrix.public_url }}
          VITE_DATA_FOLDER: ${{ matrix.data_folder }}
          MODE: staging
        run: ./build.sh
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.folder }}
          path: ${{ matrix.public_url }}.zip
          retention-days: 1
          if-no-files-found: error
  repack-gh-pages:
    name: Repack GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions: {}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: .
      - name: Unzip all zip from multiple zips
        run: |
          mkdir build-all
          cp build-*/*.zip build-all
          cd build-all
          ls
          unzip '*.zip'
          mv gallery/* .
          rm -rf gallery
          rm *.zip
          ls
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build-all
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: repack-gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
